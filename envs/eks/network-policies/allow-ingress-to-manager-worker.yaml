apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-manager-worker
  namespace: wazuh
spec:
  podSelector:
    matchLabels:
      app: wazuh-manager
      node-type: worker
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    # Wazuh 5.x agents: communication and enrollment over the same HTTPS channel
    - protocol: TCP
      port: 1517
    # Wazuh 4.x agents: communication (legacy remoted)
    - protocol: TCP
      port: 1514
