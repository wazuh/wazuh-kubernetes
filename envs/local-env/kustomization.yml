apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../wazuh

patches:
- path: storage-class.yaml
- path: indexer-resources.yaml
- path: wazuh-master-resources.yaml
- path: wazuh-resources.yaml

# Indexer setup configuration (index templates and ISM policies), optional.
# Edit ../../wazuh/indexer_stack/wazuh-indexer/setup/setup.yml and uncomment the next two lines to provide it
# to every Indexer pod. See docs/ref/configuration/configuration-files.md.
# components:
# - ../../wazuh/indexer_stack/wazuh-indexer/setup
