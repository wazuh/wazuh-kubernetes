apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager-master
  namespace: wazuh
spec:
  template:
    spec:
      containers:
        - name: wazuh-manager
          env:
            - name: WAZUH_INDEXER_HOSTS
              value: 'wazuh-indexer-0.wazuh-indexer:9200'
