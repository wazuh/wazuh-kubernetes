# Wazuh dashboard configuration claim

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wazuh-dashboard-config
  namespace: wazuh
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: wazuh-storage
  resources:
    requests:
      storage: 1Gi
