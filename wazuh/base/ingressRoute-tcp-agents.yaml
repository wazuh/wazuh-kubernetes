# Wazuh 5.x agents: raw TCP forwarding to remoted's HTTPS channel.
#
# The router carries no TLS section on purpose: Traefik takes no part in the
# encryption, so the agent validates the manager certificate end to end and its
# own client certificate reaches remoted intact.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: wazuh-agents
  namespace: wazuh
spec:
  entryPoints:
    - wazuh-1517
  routes:
  - match: HostSNI(`*`)
    services:
    - name: wazuh-agents
      port: 1517
