# Wazuh workers StatefulSet

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager-worker
  namespace: wazuh
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wazuh-manager
      node-type: worker
  serviceName: wazuh-cluster
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app: wazuh-manager
        node-type: worker
      name: wazuh-manager-worker
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: wazuh-manager
                    node-type: worker
      volumes:
        - name: wazuh-authd-pass
          secret:
            secretName: wazuh-authd-pass
        - name: wazuh-manager-certs-raw
          secret:
            secretName: manager-certs
            defaultMode: 0400
        - name: wazuh-manager-certs
          emptyDir: {}
      securityContext:
        fsGroup: 101
      initContainers:
        - name: init-wazuh-etc
          image: 'wazuh/wazuh-manager:5.0.0'
          command:
            - /bin/sh
            - -c
            - |
              if [ -z "$(ls -A /pvc-etc)" ]; then
                cp -a /var/wazuh-manager/etc/* /pvc-etc/
                chown root:101 /pvc-etc/certs
                chmod 1770 /pvc-etc/certs
              fi
              cp /tmp/certs-raw/root-ca.pem /etc/wazuh-certs-final/root-ca.pem
              cp /tmp/certs-raw/manager.pem /etc/wazuh-certs-final/indexer-connector.pem
              cp /tmp/certs-raw/manager-key.pem /etc/wazuh-certs-final/indexer-connector-key.pem
              chown root:101 /etc/wazuh-certs-final/root-ca.pem /etc/wazuh-certs-final/indexer-connector.pem /etc/wazuh-certs-final/indexer-connector-key.pem
              chmod 0640 /etc/wazuh-certs-final/root-ca.pem /etc/wazuh-certs-final/indexer-connector.pem /etc/wazuh-certs-final/indexer-connector-key.pem
          volumeMounts:
            - name: wazuh-manager-worker
              mountPath: /pvc-etc
              subPath: wazuh/var/wazuh-manager/etc
            - name: wazuh-manager-certs-raw
              mountPath: /tmp/certs-raw
            - name: wazuh-manager-certs
              mountPath: /etc/wazuh-certs-final
      containers:
        - name: wazuh-manager
          image: 'wazuh/wazuh-manager:5.0.0'
          resources:
            limits:
              cpu: 400m
              memory: 1280Mi
          securityContext:
            capabilities:
              add: ["SYS_CHROOT"]
          volumeMounts:
            - name: wazuh-authd-pass
              mountPath: /wazuh-config-mount/etc/authd.pass
              subPath: authd.pass
              readOnly: true
            - name: wazuh-manager-worker
              mountPath: /var/wazuh-manager/api/configuration
              subPath: wazuh/var/wazuh-manager/api/configuration
            - name: wazuh-manager-worker
              mountPath: /var/wazuh-manager/etc
              subPath: wazuh/var/wazuh-manager/etc
            - name: wazuh-manager-certs
              mountPath: /var/wazuh-manager/etc/certs/root-ca.pem
              subPath: root-ca.pem
            - name: wazuh-manager-certs
              mountPath: /var/wazuh-manager/etc/certs/indexer-connector.pem
              subPath: indexer-connector.pem
            - name: wazuh-manager-certs
              mountPath: /var/wazuh-manager/etc/certs/indexer-connector-key.pem
              subPath: indexer-connector-key.pem
            - name: wazuh-manager-worker
              mountPath: /var/wazuh-manager/logs
              subPath: wazuh/var/wazuh-manager/logs
            - name: wazuh-manager-worker
              mountPath: /var/wazuh-manager/queue
              subPath: wazuh/var/wazuh-manager/queue
            - name: wazuh-manager-worker
              mountPath: /var/wazuh-manager/var/multigroups
              subPath: wazuh/var/wazuh-manager/var/multigroups
            - name: wazuh-manager-worker
              mountPath: /var/wazuh-manager/active-response/bin
              subPath: wazuh/var/wazuh-manager/active-response/bin
          ports:
            - containerPort: 1517
              name: agents-https
            - containerPort: 1514
              name: agents-events
            - containerPort: 1516
              name: cluster
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /var/wazuh-manager/bin/wazuh-manager-control status 2>/dev/null | grep -v apid | grep -q 'not running' && exit 1 || exit 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /var/wazuh-manager/bin/wazuh-manager-control status 2>/dev/null | grep -v apid | grep -q 'not running' && exit 1 || exit 0
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /var/wazuh-manager/bin/wazuh-manager-control status 2>/dev/null | grep -v apid | grep -q 'not running' && exit 1 || exit 0
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          env:
            - name: WAZUH_INDEXER_HOSTS
              value: 'wazuh-indexer:9200'
            - name: WAZUH_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WAZUH_NODE_TYPE
              value: 'worker'
            - name: WAZUH_REMOTE_BIND_ADDR
              value: '0.0.0.0'
            - name: WAZUH_CLUSTER_BIND_ADDR
              value: '0.0.0.0'
            - name: WAZUH_CLUSTER_NODES
              value: 'wazuh-cluster'
            - name: INDEXER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: indexer-cred
                  key: username
            - name: INDEXER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: indexer-cred
                  key: password
            - name: SSL_CERTIFICATE_AUTHORITIES
              value: /var/wazuh-manager/etc/certs/root-ca.pem
            - name: SSL_CERTIFICATE
              value: /var/wazuh-manager/etc/certs/indexer-connector.pem
            - name: SSL_KEY
              value: /var/wazuh-manager/etc/certs/indexer-connector-key.pem
            - name: WAZUH_CLUSTER_KEY
              valueFrom:
                secretKeyRef:
                  name: wazuh-cluster-key
                  key: key
  volumeClaimTemplates:
    - metadata:
        name: wazuh-manager-worker
        namespace: wazuh
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: wazuh-storage
        resources:
          requests:
            storage: 500Mi
