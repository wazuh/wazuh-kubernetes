apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik
rules:
  # Bound only in the wazuh namespace (wazuh/base/traefik-role-binding.yaml).
  # Traefik's kubernetescrd provider starts informers for all of these and
  # does not load any route until every one of them has synced.
  - apiGroups: [""]
    resources:
      - services
      - secrets
      - configmaps
    verbs: ["get","list","watch"]

  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get","list","watch"]

  - apiGroups: ["traefik.io"]
    resources: ["*"]
    verbs: ["get","list","watch"]
